name: Build and publish agent

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Windows agent
        run: dotnet publish TelemetryCollectorService.Agent/TelemetryCollectorService.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/win-x64
      - name: Publish Linux agent
        run: dotnet publish TelemetryCollectorService.Agent/TelemetryCollectorService.Agent.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/linux-x64
      - name: Package releases
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/telemetry-agent-win-x64.zip
          tar -czf artifacts/telemetry-agent-linux-x64.tar.gz -C artifacts/linux-x64 .
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/telemetry-agent-win-x64.zip artifacts/telemetry-agent-linux-x64.tar.gz --generate-notes
